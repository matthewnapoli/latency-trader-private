[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "latency-trader"
version = "0.1.0"
description = "Exchange-agnostic prediction-market capture and latency analysis for tennis CV signals"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43",
  "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
latency-trader = "latency_trader.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

